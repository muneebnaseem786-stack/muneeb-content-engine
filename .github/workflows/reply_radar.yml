name: Reply Radar

on:
  schedule:
    # 9am / 2pm / 9pm UAE (UTC+4) = 5am / 10am / 5pm UTC
    - cron: '0 5,10,17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (fetch + style assignment only)'
        required: false
        default: 'false'

jobs:
  reply-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Reply Radar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m scripts.content.reply_radar --dry-run
          else
            python -m scripts.content.reply_radar
          fi

      - name: Commit queue + cooldown updates
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reply_queue.json data/.recent_reply_authors.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: reply radar [skip ci]"
          git pull --rebase --autostash || true
          git push
