name: Telegram Poller

on:
  schedule:
    # Every 5 minutes during UAE waking hours (6am-midnight = 2am-8pm UTC)
    - cron: '*/5 2-19 * * *'
  workflow_dispatch:

concurrency:
  group: telegram-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Poll Telegram for callbacks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/telegram/poller.py

      - name: Commit data updates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reaction_queue.json data/reply_queue.json data/posted_log.json data/feedback_log.json data/telegram_offset.json data/lessons_learned.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: telegram poller [skip ci]"
          # Pull with autostash in case remote moved while we were running
          git pull --rebase --autostash || true
          git push
