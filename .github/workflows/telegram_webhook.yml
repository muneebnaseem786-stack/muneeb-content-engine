name: Telegram Webhook

on:
  repository_dispatch:
    types: [telegram_update]
  workflow_dispatch:

concurrency:
  group: telegram-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Poll Telegram for callbacks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/telegram/poller.py

      - name: Commit data updates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reaction_queue.json data/reply_queue.json data/content_ideas.json data/substack_articles.json data/linkedin_posts.json data/posted_log.json data/feedback_log.json data/telegram_offset.json data/lessons_learned.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: telegram webhook [skip ci]"
          git pull --rebase --autostash || true
          git push
