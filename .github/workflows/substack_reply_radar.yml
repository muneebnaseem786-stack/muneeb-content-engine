name: Substack Reply Radar

on:
  schedule:
    # 2x daily: 6am and 2pm UTC (10am and 6pm UAE)
    - cron: "0 6 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic requests feedparser

      - name: Run Substack Reply Radar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m scripts.content.substack_reply_radar

      - name: Commit queue + cooldown
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/substack_reply_queue.json data/.substack_reply_cooldown.json || true
          git diff --cached --quiet || git commit -m "chore: substack reply radar run $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
